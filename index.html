<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ekspedisi Segitiga Istimewa</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;font-family:Arial,sans-serif;color:#17346b;background:linear-gradient(135deg,#dff5ff,#fff0f7,#fff8d9)}
.wrap{max-width:850px;margin:auto}
header{padding:24px;border-radius:22px;color:white;background:linear-gradient(120deg,#1768dc,#7942c7);text-align:center}
header h1{margin:8px 0;font-size:clamp(25px,5vw,38px)}
header p{line-height:1.5}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.stat{background:white;padding:10px 14px;border-radius:12px;font-weight:bold}
.track{height:12px;background:#d5e3ff;border-radius:20px;overflow:hidden;margin:15px 0}
#bar{height:100%;width:0;background:#20b878;transition:.3s}
.card{background:white;padding:clamp(18px,4vw,30px);border-radius:20px;box-shadow:0 5px 0 #c9daf5}
h2{margin-top:0}
.note{padding:13px;background:#fff5ce;border-left:5px solid #ffca38;border-radius:10px;line-height:1.6;margin:15px 0}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:13px;font-weight:bold}
.option{background:#eff5ff;color:#17346b;border:2px solid #d5e3ff;text-align:left}
.option:hover{background:#e0eaff}
.option:disabled{cursor:default;opacity:.8}
.mainbtn{background:linear-gradient(100deg,#216ee8,#7353df);color:white;margin-top:12px}
#feedback{display:none;padding:14px;border-radius:12px;margin:14px 0;line-height:1.6}
#feedback.show{display:block}
.good{background:#ddfff0;color:#126b49}
.try{background:#fff3d4;color:#754c00}
.finish{text-align:center}
.finish h2{line-height:1.4}
footer{text-align:center;padding:18px 5px;font-size:13px;color:#52678d}
@media(max-width:520px){.options{grid-template-columns:1fr}body{padding:9px}.card{padding:17px}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div>🚀 MISI MATEMATIKA • KELAS IX</div>
<h1>Ekspedisi Segitiga Istimewa</h1>
<p>Kenali pola sisi, pecahkan tantangan, dan kumpulkan poin! Jika jawaban belum tepat, pelajari petunjuk lalu coba kembali.</p>
</header>
<div class="stats">
<div class="stat">⭐ Skor: <span id="score">0</span>/100</div>
<div class="stat">🧭 Misi: <span id="stage">1</span>/5</div>
<div class="stat">🏆 Benar: <span id="count">0</span>/5</div>
</div>
<div class="track"><div id="bar"></div></div>
<main class="card" id="game"></main>
<footer>Belajar • Berlatih • Bertumbuh | Matematika Online SMP Negeri 3 Lahewa</footer>
</div>
<script>
const qs=[
{title:"Kenali Pola Sisi",q:"Pada segitiga siku-siku 45°–45°–90°, jika AB dan BC adalah sisi siku-siku dan AC sisi miring, perbandingan AB : BC : AC adalah …",note:"Dua sisi siku-sikunya sama panjang. Sisi miringnya √2 kali panjang salah satu sisi siku-siku.",opts:["1 : 1 : √2","1 : √3 : 2","1 : 2 : √3","2 : 2 : √2"],ans:0,ex:"Benar! Perbandingan sisi segitiga 45°–45°–90° adalah 1 : 1 : √2."},
{title:"Pasangkan Sisi dan Sudut",q:"Segitiga ABC memiliki sudut A = 60°, B = 90°, dan C = 30°. Sisi AB, BC, dan AC berturut-turut berhadapan dengan sudut …",note:"Sisi di depan sudut 30° adalah yang terpendek. Sisi di depan sudut 90° adalah sisi miring.",opts:["30°, 60°, 90°","60°, 30°, 90°","90°, 60°, 30°","30°, 90°, 60°"],ans:0,ex:"Tepat! AB di depan sudut C = 30°, BC di depan sudut A = 60°, dan AC di depan sudut B = 90°."},
{title:"Hitung Sisi Miring",q:"Segitiga ABC memiliki sudut 45°–45°–90°. Jika AB = 7 cm dan B = 90°, panjang AC adalah …",note:"Gunakan AB : AC = 1 : √2. Susun perbandingan, kemudian kalikan silang.",opts:["7√2 cm","7 + √2 cm","14 cm","7 cm"],ans:0,ex:"Benar! 7 : AC = 1 : √2, sehingga AC = 7√2 cm."},
{title:"Gunakan Rasio 30°–60°–90°",q:"Pada segitiga ABC, A = 60°, B = 90°, dan C = 30°. Jika BC = 8 cm, panjang sisi miring AC adalah …",note:"AB : BC : AC = 1 : √3 : 2. Maka BC : AC = √3 : 2.",opts:["8√3 cm","16√3/3 cm","4√3 cm","16 cm"],ans:1,ex:"Tepat! 8 : AC = √3 : 2. Maka AC = 16/√3 = 16√3/3 cm."},
{title:"Tantangan Tangga",q:"Sebuah tangga sepanjang 10 meter bersandar pada dinding. Sudut antara tangga dan lantai adalah 60°. Berapa tinggi yang dicapai tangga pada dinding?",note:"Tangga adalah sisi miring. Tinggi dinding berada di depan sudut 60°. Gunakan rasio 30°–60°–90°.",opts:["5 m","5√3 m","10√3 m","10 m"],ans:1,ex:"Hebat! Tinggi = 10 × sin 60° = 10 × √3/2 = 5√3 meter."}
];
let i=0,score=0,correct=0,done=Array(5).fill(false),first=Array(5).fill(true);
const game=document.getElementById("game");
function stats(){document.getElementById("score").textContent=score;document.getElementById("stage").textContent=Math.min(i+1,5);document.getElementById("count").textContent=correct;document.getElementById("bar").style.width=(i/5*100)+"%";}
function render(){
 stats();
 if(i>=qs.length){finish();return}
 const q=qs[i];
 game.innerHTML=`<h2>🎯 Misi ${i+1}: ${q.title}</h2><p>${q.q}</p><div class="note">💡 <b>Petunjuk:</b> ${q.note}</div><div class="options">${q.opts.map((o,j)=>`<button class="option" data-n="${j}">${String.fromCharCode(65+j)}. ${o}</button>`).join("")}</div><div id="feedback"></div><p><small>Jawaban benar pada percobaan pertama bernilai 20 poin. Jawaban salah tidak mengurangi skor.</small></p><button class="mainbtn" id="next" disabled>${i===4?"Lihat Hasil":"Misi Berikutnya →"}</button>`;
 document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>answer(+b.dataset.n,b));
 document.getElementById("next").onclick=()=>{if(done[i]){i++;render()}};
}
function answer(n,b){
 if(done[i])return;
 const q=qs[i],f=document.getElementById("feedback");
 if(n===q.ans){
  done[i]=true;correct++;if(first[i])score+=20;
  b.style.background="#ddfff0";b.style.borderColor="#20b878";
  f.className="show good";
  f.innerHTML="🎉 "+q.ex+(first[i]?"<br>⭐ Kamu memperoleh 20 poin!":"<br>Jawaban benar, tetapi poin misi ini tidak bertambah karena percobaan sebelumnya keliru.");
  document.querySelectorAll("[data-n]").forEach(x=>x.disabled=true);
  document.getElementById("next").disabled=false;stats();
  document.getElementById("bar").style.width=((i+1)/5*100)+"%";
 }else{
  first[i]=false;b.style.background="#ffe7eb";b.style.borderColor="#ff6480";b.disabled=true;
  f.className="show try";f.innerHTML="🔎 Belum tepat. Baca kembali petunjuk dan pilih jawaban lain.";
 }
}
function finish(){
 stats();
 game.innerHTML=`<div class="finish"><div style="font-size:65px">🏆</div><h2>${score===100?"Luar biasa! Kamu Penjelajah Segitiga Istimewa!":score>=60?"Hebat! Terus tingkatkan pemahamanmu!":"Terus berlatih! Setiap percobaan membuatmu semakin paham."}</h2><div style="font-size:38px;font-weight:bold;color:#6542c5">${score}/100</div><p>Jawaban benar: ${correct} dari 5 misi.</p><div class="note"><b>Ingat konsep utama:</b><br>45°–45°–90°: 1 : 1 : √2<br>30°–60°–90°: 1 : √3 : 2</div><p>Skor setiap misi adalah 20 poin jika benar pada percobaan pertama. Jawaban salah tidak mengurangi skor.</p><button class="mainbtn" id="restart">🔄 Main Lagi</button></div>`;
 document.getElementById("restart").onclick=()=>{i=0;score=0;correct=0;done=Array(5).fill(false);first=Array(5).fill(true);render()};
}
render();
</script>
</body>
</html>
